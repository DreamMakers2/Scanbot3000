name: Install ScanBot3000 hero

on:
  push:
    branches: [main]
    paths:
      - '.hero-transfer/READY'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reconstruct full-resolution hero
        shell: bash
        run: |
          set -euo pipefail
          cat .hero-transfer/chunk-* | base64 -d > docs/assets/scanbot3000-hero.webp
          echo "a5fa1288af3c99c77f49be4da80da633ce164caaf090bacc4e35ae9a2c20c9f0  docs/assets/scanbot3000-hero.webp" | sha256sum -c -
          sed -i 's#docs/assets/scanbot3000-hero\.svg#docs/assets/scanbot3000-hero.webp#g' README.md
          rm -f docs/assets/scanbot3000-hero.svg
          rm -rf .hero-transfer
          rm -f .github/workflows/install-scanbot-hero.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: replace hero with full-resolution image"
          git push origin HEAD:main
