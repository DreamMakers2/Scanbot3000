<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">ScanBot3000 project overview</title>
  <desc id="desc">Browser visualization flows through a Raspberry Pi control server to a Teensy supervisor and ESP32-S3 axis controllers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0b1830"/><stop offset="1" stop-color="#101d2d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58d7ff"/><stop offset="1" stop-color="#8b7cff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.30"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#78d8ff"/></marker>
  </defs>
  <rect width="1600" height="620" rx="32" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#79d9ff" stroke-width="1">
    <path d="M80 94H310M80 130H220M1320 96H1515M1390 132H1515"/>
    <circle cx="72" cy="94" r="4" fill="#79d9ff"/><circle cx="312" cy="94" r="4" fill="#79d9ff"/><circle cx="1320" cy="96" r="4" fill="#79d9ff"/><circle cx="1518" cy="132" r="4" fill="#79d9ff"/>
  </g>
  <text x="100" y="118" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="60" font-weight="760" fill="#f5f9ff" letter-spacing="-1.5">ScanBot3000</text>
  <rect x="100" y="145" width="485" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="100" y="188" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" fill="#9fb4cc">Open motion-control, visualization, and scanning stack</text>

  <g filter="url(#shadow)">
    <rect x="100" y="270" width="280" height="205" rx="24" fill="#101f34" stroke="#29415d"/>
    <rect x="430" y="270" width="280" height="205" rx="24" fill="#101f34" stroke="#29415d"/>
    <rect x="760" y="270" width="280" height="205" rx="24" fill="#101f34" stroke="#29415d"/>
    <rect x="1090" y="270" width="410" height="205" rx="24" fill="#101f34" stroke="#29415d"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <circle cx="150" cy="320" r="24" fill="#163b51" stroke="#58d7ff"/>
    <rect x="138" y="309" width="24" height="16" rx="3" fill="none" stroke="#8be5ff" stroke-width="2"/><path d="M145 330h10" stroke="#8be5ff" stroke-width="2"/>
    <text x="190" y="318" font-size="15" font-weight="700" fill="#58d7ff">KINEMATICS</text>
    <text x="140" y="365" font-size="25" font-weight="700" fill="#f5f9ff">Browser UI</text>
    <text x="140" y="398" font-size="16" fill="#9fb4cc">Three.js visualization</text>
    <text x="140" y="424" font-size="16" fill="#9fb4cc">scan paths + range cloud</text>

    <circle cx="480" cy="320" r="24" fill="#173b36" stroke="#62d6b1"/>
    <path d="M467 312h26v17h-26zM473 307h14M473 334h14" fill="none" stroke="#83e7c7" stroke-width="2"/>
    <text x="520" y="318" font-size="15" font-weight="700" fill="#62d6b1">CONTROL</text>
    <text x="470" y="365" font-size="25" font-weight="700" fill="#f5f9ff">Raspberry Pi</text>
    <text x="470" y="398" font-size="16" fill="#9fb4cc">FastAPI + WebSocket</text>
    <text x="470" y="424" font-size="16" fill="#9fb4cc">UART bridge + dashboard</text>

    <circle cx="810" cy="320" r="24" fill="#302d55" stroke="#9a8cff"/>
    <rect x="799" y="309" width="22" height="22" rx="3" fill="none" stroke="#b0a6ff" stroke-width="2"/><path d="M793 315h6M793 325h6M821 315h6M821 325h6" stroke="#b0a6ff" stroke-width="2"/>
    <text x="850" y="318" font-size="15" font-weight="700" fill="#a89cff">SUPERVISOR</text>
    <text x="800" y="365" font-size="25" font-weight="700" fill="#f5f9ff">Teensy 4.1</text>
    <text x="800" y="398" font-size="16" fill="#9fb4cc">homing + coordination</text>
    <text x="800" y="424" font-size="16" fill="#9fb4cc">console + soft limits</text>

    <circle cx="1140" cy="320" r="24" fill="#44321b" stroke="#ffc66d"/>
    <path d="M1128 310h24v20h-24zM1134 305v5M1146 305v5M1134 330v5M1146 330v5" fill="none" stroke="#ffd28e" stroke-width="2"/>
    <text x="1180" y="318" font-size="15" font-weight="700" fill="#ffc66d">AXIS NODES</text>
    <text x="1130" y="365" font-size="25" font-weight="700" fill="#f5f9ff">ESP32-S3 × 4</text>
    <text x="1130" y="398" font-size="16" fill="#9fb4cc">R · Z · X1 · X2</text>
    <text x="1130" y="424" font-size="16" fill="#9fb4cc">TMC2209 + sensors + UI</text>
  </g>

  <g stroke="#78d8ff" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M380 372H420"/><path d="M710 372H750"/><path d="M1040 372H1080"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#83a5c3" text-anchor="middle">
    <text x="405" y="354">REST / WS</text><text x="735" y="354">UART</text><text x="1065" y="354">framed UART</text>
  </g>
  <text x="100" y="555" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#758da8">Three focused repositories · one reproducible system manifest · local-network control boundary</text>
</svg>
