<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">ScanBot3000 technical architecture</title>
  <desc id="desc">Detailed left-to-right architecture from operator browser through FastAPI control and Teensy supervisor to four ESP32-S3 axes and sensors.</desc>
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17324d" flood-opacity="0.12"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3a82c4"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a82c4"/></marker>
  </defs>
  <rect width="1800" height="980" fill="#f6f9fc"/>
  <text x="90" y="92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="750" fill="#11253b">ScanBot3000 technical architecture</text>
  <text x="90" y="130" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#60758a">Browser visualization → local control bridge → embedded motion supervisor → distributed axis controllers</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="95" y="198" font-size="14" font-weight="700" fill="#3a82c4">01 · OPERATOR LAYER</text>
    <text x="475" y="198" font-size="14" font-weight="700" fill="#25876f">02 · CONTROL HOST</text>
    <text x="875" y="198" font-size="14" font-weight="700" fill="#7163c6">03 · MOTION SUPERVISOR</text>
    <text x="1275" y="198" font-size="14" font-weight="700" fill="#b87828">04 · DISTRIBUTED AXES</text>
  </g>

  <g filter="url(#s)">
    <rect x="90" y="225" width="310" height="330" rx="26" fill="#fff" stroke="#d7e3ee"/>
    <rect x="460" y="225" width="330" height="330" rx="26" fill="#fff" stroke="#d7e3ee"/>
    <rect x="850" y="225" width="330" height="330" rx="26" fill="#fff" stroke="#d7e3ee"/>
    <rect x="1240" y="225" width="470" height="530" rx="26" fill="#fff" stroke="#d7e3ee"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="120" y="260" width="54" height="54" rx="14" fill="#e9f6fc"/><rect x="132" y="273" width="30" height="20" rx="3" fill="none" stroke="#3a82c4" stroke-width="2.3"/><path d="M140 303h14" stroke="#3a82c4" stroke-width="2.3"/>
    <text x="120" y="355" font-size="27" font-weight="720" fill="#11253b">ScanBot3000</text><text x="120" y="386" font-size="27" font-weight="720" fill="#11253b">Kinematics</text>
    <text x="120" y="430" font-size="16" fill="#60758a">Static HTML / CSS / JS</text><text x="120" y="456" font-size="16" fill="#60758a">Three.js 0.157.0</text><text x="120" y="482" font-size="16" fill="#60758a">scan paths · point cloud</text><text x="120" y="508" font-size="16" fill="#60758a">standalone visualization</text>

    <rect x="490" y="260" width="54" height="54" rx="14" fill="#e9f8f3"/><path d="M502 277h30v19h-30zM509 271h16M509 302h16" fill="none" stroke="#25876f" stroke-width="2.3"/>
    <text x="490" y="355" font-size="27" font-weight="720" fill="#11253b">Raspberry Pi 4B</text>
    <text x="490" y="388" font-size="18" font-weight="650" fill="#25876f">ScanBot3000-control</text>
    <text x="490" y="430" font-size="16" fill="#60758a">FastAPI + Uvicorn</text><text x="490" y="456" font-size="16" fill="#60758a">REST + WebSocket</text><text x="490" y="482" font-size="16" fill="#60758a">pyserial UART bridge</text><text x="490" y="508" font-size="16" fill="#60758a">local dashboard + buffers</text>

    <rect x="880" y="260" width="54" height="54" rx="14" fill="#f0edff"/><rect x="893" y="273" width="28" height="28" rx="4" fill="none" stroke="#7163c6" stroke-width="2.3"/><path d="M887 280h6M887 294h6M921 280h6M921 294h6" stroke="#7163c6" stroke-width="2.3"/>
    <text x="880" y="355" font-size="27" font-weight="720" fill="#11253b">Teensy 4.1</text>
    <text x="880" y="388" font-size="18" font-weight="650" fill="#7163c6">motion supervisor</text>
    <text x="880" y="430" font-size="16" fill="#60758a">homing + coordination</text><text x="880" y="456" font-size="16" fill="#60758a">soft-limit enforcement</text><text x="880" y="482" font-size="16" fill="#60758a">telemetry aggregation</text><text x="880" y="508" font-size="16" fill="#60758a">USB + Pi console mirror</text>

    <text x="1275" y="274" font-size="27" font-weight="720" fill="#11253b">ESP32-S3 axis controllers</text>
    <text x="1275" y="307" font-size="16" fill="#60758a">Each node: TMC2209 · DS18B20 · limit input · OLED · LEDs</text>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#s)">
    <rect x="1275" y="345" width="190" height="145" rx="18" fill="#fffaf1" stroke="#eed5ad"/><text x="1300" y="380" font-size="21" font-weight="720" fill="#6a4619">R axis</text><text x="1300" y="412" font-size="15" fill="#745f46">VL6180X ranging</text><text x="1300" y="438" font-size="15" fill="#745f46">NeoPixel activity</text><text x="1300" y="464" font-size="15" fill="#745f46">range sampling</text>
    <rect x="1485" y="345" width="190" height="145" rx="18" fill="#fffaf1" stroke="#eed5ad"/><text x="1510" y="380" font-size="21" font-weight="720" fill="#6a4619">Z axis</text><text x="1510" y="412" font-size="15" fill="#745f46">AS5600 encoder</text><text x="1510" y="438" font-size="15" fill="#745f46">home / limit role</text><text x="1510" y="464" font-size="15" fill="#745f46">direction inversion</text>
    <rect x="1275" y="510" width="190" height="145" rx="18" fill="#fffaf1" stroke="#eed5ad"/><text x="1300" y="545" font-size="21" font-weight="720" fill="#6a4619">X1 axis</text><text x="1300" y="577" font-size="15" fill="#745f46">AS5600 encoder</text><text x="1300" y="603" font-size="15" fill="#745f46">virtual X / P pair</text><text x="1300" y="629" font-size="15" fill="#745f46">stepper telemetry</text>
    <rect x="1485" y="510" width="190" height="145" rx="18" fill="#fffaf1" stroke="#eed5ad"/><text x="1510" y="545" font-size="21" font-weight="720" fill="#6a4619">X2 axis</text><text x="1510" y="577" font-size="15" fill="#745f46">AS5600 encoder</text><text x="1510" y="603" font-size="15" fill="#745f46">virtual X / P pair</text><text x="1510" y="629" font-size="15" fill="#745f46">stepper telemetry</text>
  </g>

  <g stroke="#3a82c4" stroke-width="2.5" fill="none" marker-start="url(#ab)" marker-end="url(#a)">
    <path d="M400 390H450"/><path d="M790 390H840"/><path d="M1180 390H1230"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#516b84" text-anchor="middle">
    <rect x="400" y="336" width="50" height="34" rx="12" fill="#f6f9fc"/><text x="425" y="357">REST</text><text x="425" y="374">WS</text>
    <rect x="790" y="340" width="50" height="30" rx="12" fill="#f6f9fc"/><text x="815" y="360">UART</text>
    <rect x="1180" y="330" width="50" height="42" rx="12" fill="#f6f9fc"/><text x="1205" y="350">framed</text><text x="1205" y="367">UART</text>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="90" y="805" width="1620" height="105" rx="22" fill="#11253b"/>
    <text x="125" y="844" font-size="15" font-weight="700" fill="#71d5ff">TRUST &amp; SAFETY BOUNDARY</text>
    <text x="125" y="879" font-size="16" fill="#d2deea">The FastAPI control surface is unauthenticated by design and intended for a trusted local network. Physical motion limits and emergency-stop strategy remain machine responsibilities.</text>
  </g>
</svg>
